name: Aggiorna programmazione

on:
  schedule:
    - cron: "17 4 * * *"    # ~05:17 ora italiana (inverno)
    - cron: "47 11 * * *"   # ~12:47, per le modifiche di metà giornata
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scraper/**", "data/thespace.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Scarica programmazione
        run: python scraper/scrape.py
      - name: Salva cache IMDb
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imdb-cache.json
          git diff --cached --quiet || (git commit -m "Aggiorna cache IMDb" && git push)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
